# YCT root-path application routes. This file is included inside the existing server block.

location = / {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /content-assets/ {
    alias C:/wwwroot/yct-runtime/content-assets/;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
    expires 30d;
}

# Existing /v2 Service Worker registrations fetch this script once and retire themselves.
location = /v2/sw.js {
    proxy_pass http://127.0.0.1:3300/retire-v2-sw.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
}

location = /v2 {
    return 307 /$is_args$args;
}

location ~ ^/v2(?<yct_root_path>/.*)$ {
    return 307 $yct_root_path$is_args$args;
}

location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}

# Existing static directories continue to be served by the current site root.
location / {
    try_files $uri $uri/ @yct_root_app;
}

location @yct_root_app {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
